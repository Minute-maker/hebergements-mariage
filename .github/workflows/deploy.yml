# Compile l'application et la publie sur GitHub Pages à chaque envoi sur la
# branche principale. Rien à installer : tout se passe chez GitHub.
#
# À activer une fois, dans le dépôt : Settings → Pages → Source : « GitHub Actions ».
#
# Le jeton Mapbox est facultatif. Pour l'utiliser, ajoutez-le en secret de dépôt
# (Settings → Secrets and variables → Actions → New repository secret) sous le nom
# VITE_MAPBOX_TOKEN, et autorisez le domaine github.io dans les restrictions d'URL
# du jeton. Sans secret, la carte utilise OpenStreetMap.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
